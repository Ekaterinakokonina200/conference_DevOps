# Непрерывная интеграция (ЛР №5): обязательный барьер перед публикацией образа.
#
# В CI выполняются ТЕ ЖЕ команды make, что и локально (make verify,
# make container-check, make secrets-scan, ...). Поэтому «у меня работает»
# и «в CI работает» означают одно и то же.
#
#   style ──┐
#   rules ──┤
#   security┤
#   tests ──┼──► build (образ с тегом SHA + анализ образа) ──► publish (ghcr.io)
#   migrations┤                                               только main
#   backup ─┤
#   container┘
#
# publish запускается, только если ВСЕ обязательные задания успешны.
# Правила этого файла проверяет make rules-check (tools/check_rules.py),
# файл записан в .github/CODEOWNERS.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_BOOT: python
  PYTHONUTF8: "1"

jobs:
  # ---------------------------------------------------------------- стиль
  style:
    name: style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: make install
        run: make install
      - name: make format-check
        run: make format-check
      - name: make lint
        run: make lint

  # ---------------------------------------------------------------- правила
  rules:
    name: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: make install
        run: make install
      - name: make rules-check
        run: make rules-check
      - name: Изменённые критические файлы (make critical-changes)
        if: github.event_name == 'pull_request'
        run: |
          make critical-changes base=origin/${{ github.base_ref }} | tee critical.txt
          { echo '### Критические файлы приёмки'; echo '```'; cat critical.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- безопасность
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # поиск секретов во всей истории
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Дата для кэша базы уязвимостей
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Кэш базы уязвимостей trivy
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/trivy
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - name: make install
        run: make install
      - name: make sast (bandit)
        run: make sast
      - name: make secrets-scan (gitleaks)
        run: make secrets-scan
      - name: make deps-scan (trivy, requirements.txt)
        run: make deps-scan
      - name: Отчёты безопасности
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: security-reports
          path: |
            reports/bandit.*
            reports/gitleaks*
            reports/trivy-deps.*
          if-no-files-found: warn

  # ---------------------------------------------------------------- тесты
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Отдельная тестовая БД в контейнере-сервисе; пароль — из секретов репозитория
      TEST_DATABASE_URL: postgresql://postgres:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/conference_test
    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: conference_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - name: Секрет CI_DB_PASSWORD задан
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: test -n "$CI_DB_PASSWORD" || { echo "::error::Не задан секрет CI_DB_PASSWORD (Settings → Secrets and variables → Actions)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: make install
        run: make install
      - name: make test (unit + integration, покрытие)
        continue-on-error: true
        run: make test
      - name: make mutation
        shell: bash
        run: make mutation 2>&1 | tee reports/mutation.txt
      - name: Отчёты тестов и покрытия
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/htmlcov/
            reports/mutation.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------- миграции
  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Отдельная тестовая БД в контейнере-сервисе; пароль — из секретов репозитория
      TEST_DATABASE_URL: postgresql://postgres:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/conference_test
    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: conference_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: make install
        run: make install
      - name: make migrations-check (чистая и заполненная БД)
        run: make migrations-check
      - name: Отчёт миграций
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: migrations-report
          path: reports/migrations-junit.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------- резервное копирование
  backup:
    name: backup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Отдельная тестовая БД в контейнере-сервисе; пароль — из секретов репозитория
      TEST_DATABASE_URL: postgresql://postgres:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/conference_test
    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: conference_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Клиент PostgreSQL 17 (pg_dump и pg_restore той же версии, что сервер)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: make install
        run: make install
      - name: make backup-check (копия → порча → восстановление)
        shell: bash
        run: mkdir -p reports && make backup-check 2>&1 | tee reports/backup-check.txt
      - name: Отчёт резервного копирования
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: backup-report
          path: reports/backup-check.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------- контейнеры
  container:
    name: container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: make install
        run: make install
      - name: make container-check (9 шагов ЛР №4)
        shell: bash
        run: mkdir -p reports && make container-check 2>&1 | tee reports/container-check.txt
      - name: Отчёт container-check
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: container-check-report
          path: reports/container-check.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------- сборка
  build:
    name: build
    needs: [style, rules, security, tests, migrations, backup, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Имя и теги образа (тег = commit SHA)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conference-app"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Сборка образа
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Дата для кэша базы уязвимостей
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Кэш базы уязвимостей trivy
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/trivy
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - name: make install
        run: make install
      - name: make image-scan (trivy, анализ образа)
        run: make image-scan image=${{ env.IMAGE }}:${{ github.sha }}
      - name: Сохранить проверенный образ для публикации
        run: docker save -o image.tar "$IMAGE:$GITHUB_SHA" "$IMAGE:sha-$SHORT_SHA"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image
          path: image.tar
          retention-days: 1
      - name: Отчёт анализа образа
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image-scan-report
          path: reports/trivy-image.*
          if-no-files-found: warn

  # ---------------------------------------------------------------- публикация
  publish:
    name: publish
    # публикация — только после ВСЕХ обязательных проверок и только для main и тегов
    needs: [style, rules, security, tests, migrations, backup, container, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image
      - name: Загрузить проверенный образ
        run: |
          docker load -i image.tar
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conference-app" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Вход в GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Публикация образа с тегом commit SHA
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:sha-$SHORT_SHA"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:${GITHUB_REF_NAME#v}"
            docker push "$IMAGE:${GITHUB_REF_NAME#v}"
          fi
          {
            echo "### Опубликован образ"
            echo "- \`$IMAGE:$GITHUB_SHA\`"
            echo "- \`$IMAGE:sha-$SHORT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
