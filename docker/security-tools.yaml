# Образы инструментов проверки безопасности (ЛР №5).
# Одни и те же образы используются локально (make secrets-scan, deps-scan,
# image-scan) и в CI, поэтому результаты проверок совпадают.
# Образы закреплены по версии и дайджесту: make pin-images заменяет PIN_ME.
# Обновление версии или дайджеста — отдельный Pull Request (каталог docker/
# записан в .github/CODEOWNERS).

gitleaks:
  # поиск секретов (паролей, токенов, ключей) в истории Git
  image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

trivy:
  # уязвимости зависимостей (requirements.txt) и контейнерного образа
  image: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
