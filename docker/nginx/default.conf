# Nginx перед экземплярами приложения (дополнительное задание ЛР №4).
# Образ nginx-unprivileged работает от пользователя nginx (UID 101)
# и слушает порт 8080 — root для порта 80 не нужен.

# Ограничение частоты: не более 20 запросов в секунду с одного адреса,
# кратковременный всплеск до 40 запросов; сверх этого — ответ 429.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;

# Встроенный DNS Docker: имя app переразрешается каждые 10 секунд,
# поэтому перезапущенный экземпляр с новым адресом снова получает запросы.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream conference_app {
    # Имя app в сети Docker разрешается во все экземпляры (replicas: 2):
    # Nginx создаёт по серверу на каждый адрес и распределяет запросы
    # по очереди (round robin). resolve (Nginx 1.27.3+) — следить за
    # изменением адресов; для этого нужна общая память zone.
    # max_fails/fail_timeout: после 2 ошибок подряд экземпляр исключается
    # из распределения на 10 секунд, затем Nginx снова пробует его.
    zone conference_app 64k;
    server app:8000 resolve max_fails=2 fail_timeout=10s;
    # Постоянные соединения с приложением (keepalive) не используются:
    # при остановке экземпляра запрос мог уйти в уже закрытое соединение
    # с живым экземпляром, и тогда повтор доставался только остановленному —
    # клиент получал 504. Новое соединение на каждый запрос внутри сети
    # Docker почти ничего не стоит, а отказоустойчивость важнее.
}

server {
    listen 8080;
    server_tokens off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_req zone=per_ip burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://conference_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Повтор запроса на другом экземпляре, если первый не ответил.
        # POST/PUT/DELETE не повторяются (non_idempotent не включён),
        # чтобы не создать запись дважды.
        # Остановленный экземпляр не отвечает — ждать подключения 1 секунду,
        # затем запрос повторяется на другом экземпляре (каждый экземпляр
        # пробуется не более одного раза за запрос).
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Какой экземпляр ответил — видно в заголовке ответа
        add_header X-Upstream $upstream_addr always;
    }
}
