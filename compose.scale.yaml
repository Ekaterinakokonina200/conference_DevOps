# Дополнительное задание ЛР №4: Nginx и несколько экземпляров приложения.
# Используется ПОВЕРХ compose.yaml:
#   make up-scale    (docker compose -f compose.yaml -f compose.scale.yaml up ...)
#
#   браузер -> 127.0.0.1:8080 -> nginx -> app (экземпляр 1 и 2) -> db
#
# Прямого доступа к приложению нет: у app убран опубликованный порт,
# наружу открыт только порт Nginx (и только на 127.0.0.1).

services:
  app:
    # !reset — убрать порт, заданный в compose.yaml (нужен Compose 2.24+)
    ports: !reset []
    deploy:
      replicas: 2

  nginx:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
          pids: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
