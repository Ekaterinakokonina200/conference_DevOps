# Настройки Ansible (ЛР №7). Файл задаётся явно (ANSIBLE_CONFIG в infra/run.sh
# и tools/infra_check.py), поэтому работает и в каталоге с широкими правами.
[defaults]
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
forks = 5
# Понятный вывод: изменения показываются как diff, результат — в YAML
callback_result_format = yaml
display_skipped_hosts = False
nocows = True

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
