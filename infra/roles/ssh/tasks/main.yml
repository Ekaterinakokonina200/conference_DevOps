---
- name: Пакет OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Настройки защиты SSH (шаблон)
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-conference-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Перечитать настройки SSH

- name: Файлы настроек SSH, не описанные в коде
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
    excludes: 00-conference-hardening.conf
  register: ssh_unmanaged

- name: Удалить файлы настроек SSH, не описанные в коде
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ssh_unmanaged.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Перечитать настройки SSH

# В Ubuntu 24.04 SSH запускается через ssh.socket, поэтому только «запущена»
- name: Служба SSH запущена
  ansible.builtin.systemd_service:
    name: ssh
    state: started
