---
- name: Пакеты Docker (из репозитория Ubuntu)
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Каталог настроек Docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

# В JSON нет комментариев: файл описан шаблоном roles/docker/templates/daemon.json.j2
- name: Настройки Docker (шаблон)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/dockerd --validate --config-file %s
  notify: Перезапустить Docker

- name: Служба Docker включена и запущена
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
