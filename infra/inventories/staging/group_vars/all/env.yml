---
# ОКРУЖЕНЧЕСКИЕ параметры staging (ЛР №7)
env_name: staging

# Приложение staging разворачивает CD из ЛР №6 (deploy/staging/deploy.sh):
# Ansible готовит сервер и файл настроек, версию выбирает CD.
app_runtime: cd
app_image_tag: ""
app_dir: /srv/conference-staging
app_env_file_name: staging.env
compose_project: conference-staging
app_port: 8080
access_token_expire_minutes: 30

# Зеркало Docker Hub (ЛР №5: нестабильный доступ к Docker Hub)
docker_registry_mirrors:
  - https://mirror.gcr.io

# Ссылки на секреты окружения (значения — только в vault.yml)
postgres_password: "{{ vault_postgres_password }}"
jwt_secret_key: "{{ vault_jwt_secret_key }}"
admin_password_hashes: "{{ vault_admin_password_hashes }}"
