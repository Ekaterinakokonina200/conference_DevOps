---
# ОКРУЖЕНЧЕСКИЕ параметры production (ЛР №7)
env_name: production

# Приложение запускает Ansible: служба systemd conference-app поднимает
# Docker Compose. Версия фиксируется здесь и меняется только через PR.
app_runtime: systemd
app_image_tag: "0.6.0"
app_dir: /srv/conference
app_env_file_name: app.env
compose_project: conference-production
app_port: 8080
access_token_expire_minutes: 15

docker_registry_mirrors:
  - https://mirror.gcr.io

# Ссылки на секреты окружения (значения — только в vault.yml)
postgres_password: "{{ vault_postgres_password }}"
jwt_secret_key: "{{ vault_jwt_secret_key }}"
admin_password_hashes: "{{ vault_admin_password_hashes }}"
